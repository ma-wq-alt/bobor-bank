<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Проверка BOBOR-ID</title>
<style>
  body{background:#0B0B0F;color:#fff;font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;text-align:center;padding:20px;box-sizing:border-box}
  .card{background:#15151B;border:1px solid #26262E;border-radius:14px;padding:40px 20px;max-width:400px;width:100%}
  h1{color:#C6FF00;font-size:26px;margin-top:0}
  p{color:#8A8A93;font-size:15px;margin-bottom:25px}
  .btn{background:#C6FF00;color:#000;border:0;padding:12px 20px;border-radius:10px;font-size:15px;font-weight:bold;cursor:pointer;width:100%;margin-bottom:10px}
  .btn2{background:rgba(255,255,255,0.1);color:#fff;border:0;padding:12px 20px;border-radius:10px;font-size:15px;font-weight:bold;cursor:pointer;width:100%}
</style>
</head>
<body>
<div class="card" id="screen">
  <h1>Проверка BOBOR-ID...</h1>
  <p>Пожалуйста, подождите. Мы проверяем ваш паспорт. Это может занять до 1 минуты, если сервер проснулся.</p>
</div>
<script>
  var savedEmail = localStorage.getItem('bobor_email');
  
  if (!savedEmail) {
    // Если не залогинен, пускаем в банк
    window.location.href = '/index.html';
  } else {
    // Пытаемся достучаться до BOBOR-ID (с 3 попытками)
    function checkPassport(attempt) {
      fetch('https://bobor-passport.onrender.com/api/approval/' + savedEmail)
        .then(r => r.json())
        .then(data => {
          if (data.approved) {
            window.location.href = '/index.html'; // Паспорт есть
          } else {
            document.getElementById('screen').innerHTML = `
              <h1 style="color:#ff5555">🚫 ДОСТУП ЗАКРЫТ</h1>
              <p>Ваш BOBOR-ID не подтвержден.</p>
              <button class="btn" onclick="window.open('https://bobor-passport.onrender.com', '_blank')">Перейти в BOBOR-ID</button>
              <button class="btn2" onclick="location.reload()">Я подтвердил, проверить</button>
            `;
          }
        })
        .catch(() => {
          // Если ошибка связи (сервер спит), делаем еще попытку
          if (attempt < 3) {
            setTimeout(() => checkPassport(attempt + 1), 5000); // Ждем 5 секунд и пробуем снова
          } else {
            document.getElementById('screen').innerHTML = `
              <h1 style="color:#FFB800">⚠️ BOBOR-ID не отвечает</h1>
              <p>Сервер BOBOR-ID слишком долго просыпается. Пожалуйста, подождите минуту и нажмите кнопку ниже.</p>
              <button class="btn" onclick="location.reload()">Попробовать снова</button>
              <button class="btn2" onclick="window.location.href='/index.html'">Войти без проверки (опасно)</button>
            `;
          }
        });
    }

    // Начинаем проверку
    checkPassport(1);
  }
</script>
</body>
</html>
