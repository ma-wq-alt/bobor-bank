<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BANK OF BOBOR PRODUCTION</title>
<style>
  body{margin:0;background:#0B0B0F;color:#F5F5F7;font-family:Arial,sans-serif;font-size:15px;line-height:1.4}
  .wrap{max-width:720px;margin:0 auto;padding:20px}
  .card{background:#15151B;border:1px solid #26262E;border-radius:14px;padding:16px;margin-bottom:12px}
  .btn{background:#FF3D00;color:#fff;border:0;padding:10px 16px;border-radius:10px;font-weight:bold;cursor:pointer}
  .btn2{background:#C6FF00;color:#000;border:0;padding:10px 16px;border-radius:10px;font-weight:bold;cursor:pointer}
  .btn3{background:rgba(255,255,255,.1);color:#F5F5F7;border:0;padding:10px 16px;border-radius:10px;font-weight:bold;cursor:pointer}
  input,select{width:100%;padding:10px;border-radius:10px;border:1px solid #26262E;background:#000;color:#fff;box-sizing:border-box;margin-bottom:8px}
  .muted{color:#8A8A93;font-size:13px}
  .rowline{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #26262E;align-items:center;gap:8px}
  nav{display:flex;gap:4px;overflow-x:auto;margin-bottom:14px}
  nav button{background:none;border:0;color:#8A8A93;padding:8px 12px;font-size:14px;cursor:pointer;border-radius:8px}
  nav button.on{color:#FF3D00;font-weight:bold;background:rgba(255,61,0,.12)}
  .avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#26262E}
  .chat-box{height:300px;overflow-y:auto;background:#000;border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
  .msg{max-width:80%;padding:8px 12px;border-radius:12px;font-size:14px;word-break:break-word}
  .msg.my{align-self:flex-end;background:#FF3D00;color:#fff;border-bottom-right-radius:2px}
  .msg.their{align-self:flex-start;background:#26262E;color:#fff;border-bottom-left-radius:2px}
  .toast{position:fixed;bottom:16px;right:16px;background:#15151B;border:1px solid #C6FF00;padding:12px 16px;border-radius:12px;max-width:320px;z-index:100}
</style>
</head>
<body>
<div class="wrap">
  <div id="app"></div>
</div>
<script>
const TTFBL_PER_RUB = 10, RUB_PER_TTFBL = 0.1;
const FIAT = { RUB:1, USD:90, TRY:2.8, KZT:0.2 };
const CUR = ['TTFBL','RUB','USD','TRY','KZT'];
const DEC = { RUB:2, USD:2, TRY:2, KZT:2, TTFBL:0 };

function toMinor(v,c){return Math.round(Number(v)*Math.pow(10,DEC[c]));}
function fromMinor(m,c){return m/Math.pow(10,DEC[c]);}
function convert(m,f,t){ return Math.floor((m/Math.pow(10,DEC[f]))*(f==='TTFBL'?0.1:FIAT[f])/(t==='TTFBL'?0.1:FIAT[t])*Math.pow(10,DEC[t])); }
function fmt(m,c){ return (c==='TTFBL'?'◈ ':'') + fromMinor(m,c).toFixed(DEC[c]) + ' ' + c; }
function h(tag,cls,text){ const n=document.createElement(tag); if(cls)n.className=cls; if(text!=null)n.textContent=text; return n; }
function btn(label,cls,fn){ const b=h('button',cls,label); b.onclick=fn; return b; }
function input(ph,val,on,type){ const i=document.createElement('input'); i.placeholder=ph; i.value=val||''; if(type)i.type=type; i.oninput=()=>on(i.value); return i; }
function clear(n){ while(n.firstChild)n.removeChild(n.firstChild); }

let ws = null;
let me = null;
let accounts = {};
let screen = 'dashboard';
let allUsers = [];
let adminUsers = [];
let chatWith = null;
let chatHistory = [];
let toastText = '';
let savedEmail = localStorage.getItem('bobor_email');
let savedSecret = localStorage.getItem('bobor_secret');

function showToast(t) { toastText = t; render(); setTimeout(()=>{ if(toastText===t){toastText='';render();} }, 3000); }

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(proto + '://' + location.host + '/');
  ws.onopen = () => { if (savedEmail && savedSecret) send({type:'login', email: savedEmail, pwd: null, secret: savedSecret, auto: true}); else render(); };
  ws.onclose = () => { showToast('Нет соединения...'); setTimeout(connect, 2000); };
  ws.onmessage = (ev) => {
    let m = JSON.parse(ev.data);
    if (m.type === 'state') { me = m.user; accounts = m.accounts; screen='dashboard'; localStorage.setItem('bobor_email', me.email); render(); }
    else if (m.type === 'loggedout') { me = null; localStorage.clear(); render(); }
    else if (m.type === 'users_list') { allUsers = m.users; render(); }
    else if (m.type === 'chat_history') { chatHistory = m.messages; render(); }
    else if (m.type === 'new_message') { 
       if (chatWith === m.from) { send({type:'get_history', withEmail: chatWith}); } 
       else if (m.to === me.email) { showToast('Новое сообщение от ' + m.from); }
    }
    else if (m.type === 'admin_allusers') { adminUsers = m.users; render(); }
    else if (m.type === 'error') { showToast('❌ ' + m.message); }
    else if (m.type === 'toast') { showToast(m.message); }
  };
}
function send(obj) { if(ws && ws.readyState===1) ws.send(JSON.stringify(obj)); else showToast('Нет соединения'); }

function drawLogin() {
  const app = document.getElementById('app'); clear(app);
  const c = h('div','card');
  c.appendChild(h('h1',null,'BANK OF BOBOR PRODUCTION'));
  let email = savedEmail || '', pwd='', secret='';
  c.appendChild(input('Email', email, v=>email=v, 'email'));
  c.appendChild(input('Пароль', '', v=>pwd=v, 'password'));
  c.appendChild(input('Секретное слово', '', v=>secret=v, 'password'));
  c.appendChild(btn('Войти','btn',()=>{ localStorage.setItem('bobor_secret', secret); send({type:'login',email,pwd,secret}); }));
  c.appendChild(btn('Зарегистрироваться','btn3',()=>{ screen='register'; render(); }));
  app.appendChild(c);
}

function drawRegister() {
  const app = document.getElementById('app'); clear(app);
  const c = h('div','card');
  c.appendChild(h('h1',null,'Регистрация'));
  let name='', email='', pwd='', secret='';
  c.appendChild(input('Имя', '', v=>name=v));
  c.appendChild(input('Email', '', v=>email=v, 'email'));
  c.appendChild(input('Пароль', '', v=>pwd=v, 'password'));
  c.appendChild(input('Секретное слово', '', v=>secret=v, 'password'));
  c.appendChild(btn('Создать аккаунт','btn',()=>{ localStorage.setItem('bobor_secret', secret); send({type:'register',email,pwd,name,secret}); }));
  c.appendChild(btn('Назад','btn3',()=>{ screen='login'; render(); }));
  app.appendChild(c);
}

function drawApp() {
  const app = document.getElementById('app'); clear(app);
  
  const header = h('div','card rowline');
  const left = h('div', null, '');
  left.appendChild(h('b',null,'BANK OF BOBOR'));
  const right = h('div', null, '');
  right.appendChild(btn('🔄','btn3', ()=>send({type:'refresh'})));
  right.appendChild(btn('Выйти','btn3', ()=>send({type:'logout'})));
  header.appendChild(left); header.appendChild(right);
  app.appendChild(header);

  const nav = h('nav');
  const tabs = [['dashboard','Обзор'],['convert','Перевод'],['chat','💬 Чат'],['profile','Профиль']];
  if(me.role==='admin') tabs.push(['admin','Админка']);
  tabs.forEach(([id,label])=> nav.appendChild(btn(label, screen===id?'on':'', ()=>{
    screen=id;
    if(id==='chat' || id==='convert') send({type:'get_users'});
    if(id==='admin') send({type:'admin_allusers'});
    render();
  })));
  app.appendChild(nav);

  if(screen==='dashboard') {
    const c = h('div','card');
    c.appendChild(h('h2',null,'Баланс'));
    c.appendChild(h('div',null,'◈ ' + fmt(accounts.TTFBL.bal, 'TTFBL')));
    app.appendChild(c);
  }
  
  else if(screen==='convert') {
    const c = h('div','card');
    c.appendChild(h('h2',null,'Переводы'));
    let toEmail = '', amt = '100';
    const sel = document.createElement('select');
    sel.appendChild(new Option('Выбери человека...', ''));
    allUsers.filter(u=>u.email!==me.email).forEach(u=> sel.appendChild(new Option(u.name, u.email)));
    sel.onchange = () => toEmail = sel.value;
    c.appendChild(sel);
    c.appendChild(input('Сумма TTFBL', amt, v=>amt=v));
    c.appendChild(btn('Отправить','btn', ()=>send({type:'transfer', toEmail, cur:'TTFBL', amt})));
    app.appendChild(c);
  }

  else if(screen==='chat') {
    if (!chatWith) {
      const c = h('div','card');
      c.appendChild(h('h2',null,'Выбери, кому написать'));
      allUsers.filter(u=>u.email!==me.email).forEach(u=>{
        const row = h('div','rowline');
        row.style.cursor='pointer';
        const info = h('span',null, '');
        info.appendChild(h('span', u.online?'🟢 ':'⚫ '));
        info.appendChild(h('b', null, u.name));
        row.appendChild(info);
        row.onclick = () => { chatWith = u.email; send({type:'get_history', withEmail: chatWith}); };
        c.appendChild(row);
      });
      app.appendChild(c);
    } else {
      const c = h('div','card');
      const top = h('div','rowline');
      top.appendChild(h('b',null,'Чат с ' + chatWith));
      top.appendChild(btn('← Назад','btn3', ()=>{ chatWith=null; render(); }));
      c.appendChild(top);

      const box = h('div','chat-box');
      chatHistory.forEach(m => {
        const msg = h('div', 'msg ' + (m.from_email === me.email ? 'my' : 'their'), m.text);
        box.appendChild(msg);
      });
      c.appendChild(box);

      let txt = '';
      const inp = input('Написать...', '', v=>txt=v);
      inp.onkeydown = (e) => { if(e.key==='Enter') { send({type:'send_message', toEmail:chatWith, text:txt}); inp.value=''; } };
      c.appendChild(inp);
      c.appendChild(btn('Отправить','btn', ()=>{ send({type:'send_message', toEmail:chatWith, text:txt}); }));
      
      setTimeout(()=>box.scrollTop = box.scrollHeight, 100);
      app.appendChild(c);
    }
  }

  else if(screen==='profile') {
    const c = h('div','card');
    c.appendChild(h('h2',null,'Мой профиль'));
    const avatar = h('img', 'avatar');
    avatar.src = me.avatar || 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=';
    c.appendChild(avatar);
    c.appendChild(h('div',null,'Имя: ' + me.name));
    c.appendChild(h('div',null,'Почта: ' + me.email));
    c.appendChild(btn('Сменить аватар','btn2', ()=> window.open('/avatar.html?email=' + me.email, '_blank', 'width=400,height=300')));
    app.appendChild(c);
  }

  else if(screen==='admin') {
    const c = h('div','card');
    c.appendChild(h('h2',null,'Управление людьми'));
    adminUsers.forEach(u => {
      const row = h('div','rowline');
      row.appendChild(h('b',null,u.name));
      if (u.ban_until && new Date(u.ban_until) > new Date()) {
        row.appendChild(h('span', {style:'color:red'}, 'Забанен до ' + new Date(u.ban_until).toLocaleString('ru-RU')));
      } else {
        const b = btn('Забанить (24ч)','btn', ()=> send({type:'admin_ban', targetEmail:u.email, hours:24}));
        b.style.padding = '4px 8px'; b.style.fontSize='12px';
        row.appendChild(b);
      }
      c.appendChild(row);
    });
    app.appendChild(c);
  }

  if(toastText) app.appendChild(h('div','toast', toastText));
}

function render() {
  if(!me) { if(screen==='register') drawRegister(); else drawLogin(); }
  else drawApp();
}
connect();
</script>
</body>
</html>
